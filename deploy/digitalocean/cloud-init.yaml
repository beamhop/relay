#cloud-config
# SPDX-License-Identifier: AGPL-3.0-or-later
# Beamhop on a DigitalOcean Droplet (Ubuntu 24.04 / Debian 12). Paste as "User data" when
# creating the Droplet. Set DOMAIN below first (point its A/AAAA record at the Droplet), or
# leave it empty and finish in the setup wizard on http://<droplet-ip>:3334.
#
# TLS: Droplets have their public IP on eth0, so with a domain Beamhop listens on :443 and gets
# certificates itself (ACME HTTP-01 on :80). No reverse proxy needed.
# Setup link + claim code: `journalctl -u beamhop -n 30` (or `beamhop claim-code --data-dir /var/lib/beamhop`).

package_update: true
packages:
  - curl
  - ufw

write_files:
  - path: /root/beamhop-install.sh
    permissions: "0700"
    content: |
      #!/bin/sh
      set -eu
      DOMAIN=""   # e.g. relay.example.com
      if [ -n "$DOMAIN" ]; then
        curl -fsSL https://get.beamhop.dev | sh -s -- --systemd --domain "$DOMAIN"
      else
        curl -fsSL https://get.beamhop.dev | sh -s -- --systemd
      fi

runcmd:
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 3334/tcp
  - ufw --force enable
  - sh /root/beamhop-install.sh
