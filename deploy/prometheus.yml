global:
  scrape_interval: 15s
scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: beamhop
    metrics_path: /metrics
    # beamhop only serves /metrics without a token to loopback clients; the compose file writes BEAMHOP_METRICS_TOKEN
    # to this file before starting Prometheus (set the same token on the beamhop service)
    authorization:
      type: Bearer
      credentials_file: /prometheus/beamhop-metrics-token
    static_configs:
      - targets: ["beamhop:3334"]
