# Drop-in for the installer's beamhop.service on BOTH servers of an HA pair:
#   sudo useradd --system --home /var/lib/beamhop --shell /usr/sbin/nologin beamhop
#   sudo install -D -m 0644 beamhop-ha.conf /etc/systemd/system/beamhop.service.d/ha.conf
# A fixed user (instead of DynamicUser) lets Litestream and the failover restore share the files.
[Service]
DynamicUser=no
User=beamhop
Group=beamhop
