# Continuous replication of Beamhop's SQLite database (data dir layout: /data/db/beamhop.sqlite).
# Restore: litestream restore -config /etc/litestream.yml /data/db/beamhop.sqlite
dbs:
  - path: /data/db/beamhop.sqlite
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: beamhop
        endpoint: ${LITESTREAM_ENDPOINT}
        region: ${LITESTREAM_REGION}
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
        force-path-style: true
        sync-interval: 1s
        retention: 168h
        snapshot-interval: 24h
