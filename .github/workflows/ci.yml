# SPDX-License-Identifier: AGPL-3.0-or-later
# Pull requests and pushes: parallel jobs, each a few single commands you can run locally
# (see CONTRIBUTING.md). A newer push to the same branch/PR cancels the run in progress.
name: ci
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.4.3'

jobs:
  # Typecheck, lint, every bun test (incl. the vanilla-profile binary test), generated
  # reference docs, protocol conformance, SPDX headers.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      # Generated settings/actions reference must match the code.
      - run: bun docs/reference/generate.ts --check
      # Protocol conformance (NIP-01/11/42/…, Blossom) against every storage backend.
      - run: bun packages/conformance/scripts/self-check.ts --all
      # Every Beamhop source file carries the AGPL SPDX header (vendored/upstream files excluded).
      - run: bun run ci:spdx

  # Admin app (packages/pwa): svelte-check, unit tests, build, bundle budget, vanilla profile
  # (no enterprise strings in vanilla chunks, first-load budgets), Playwright E2E incl. the
  # vanilla wizard snapshot.
  admin-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pwa
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install
      - run: bun run check
      - run: bunx vitest run
      - run: bun run build
      - run: bun run size
      - run: bun ../../scripts/ci/vanilla-check.ts
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/pwa/package.json') }}
      # Both Playwright projects (iphone, desktop) render with Chromium.
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test --reporter=list,html
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            packages/pwa/playwright-report
            packages/pwa/test-results
          retention-days: 14

  # Team client (Flotilla fork): svelte-check, Beamhop unit tests, static build, then the
  # no-payments guard again with the built output present (it also scans packages/team-client/build).
  team-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install
      - run: bun run check
        working-directory: packages/team-client
      - run: bun run build
        working-directory: packages/team-client
      - run: bun test packages/team-client/src/beamhop

  # Cloudflare runtime: the workerd suite (Miniflare, default + enterprise worker), then
  # `wrangler deploy --dry-run` bundles of the default and --enterprise Worker with a gzip budget.
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install
      - run: bun run test:workerd
        working-directory: packages/runtime-cf
      - run: bun run ci:cf-bundle

  # Developer Certificate of Origin: every commit in the PR is signed off by its author.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun scripts/ci/dco-check.ts ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  # Performance regression gate (GAPS D1, PLAN §3.5): a CI-sized load test against the real
  # server (sockets, SQLite) plus signature, storage and fan-out benches, compared with the
  # floors in scripts/bench/thresholds.json (`bun run bench:gate` locally). Runs on pushes to
  # main, and on pull requests touching the hot path (relay, storage-sql, runtime-bun, core)
  # or the gate itself. results.json is uploaded as the `bench-results` artifact.
  bench:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Hot-path change?
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            | grep -qE '^(packages/(relay|storage-sql|runtime-bun|core)/|scripts/bench/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No relay/storage-sql/runtime-bun/core change: bench gate skipped."
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: bun-${{ runner.os }}-
      - if: steps.scope.outputs.run == 'true'
        run: bun install
      - if: steps.scope.outputs.run == 'true'
        run: ulimit -n 65536 && bun run bench:gate --out bench-results
      - if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results/results.json
          if-no-files-found: ignore
          retention-days: 30
